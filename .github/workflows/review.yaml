name: AI Infrastructure Review

on:
  pull_request:
    paths:
      - "**.tf"
  workflow_dispatch:
  workflow_call: # To reuse this workflow in other repositories or workflows
    secrets:
      ANTHROPIC_API_KEY:
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Review Terraform Changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Terraform diff
        id: diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD -- '*.tf' > tf.diff
          echo "Diff size: $(wc -l < tf.diff) lines"
          cat tf.diff

      # ── tflint ──────────────────────────────────────────────────────────
      - name: Install tflint
        run: |
          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash

      - name: Init tflint (install AWS plugin)
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tflint
        run: |
          tflint --format json --recursive > tflint_results.json || true
          cat tflint_results.json

      # ── Checkov ─────────────────────────────────────────────────────────
      - name: Install Checkov
        run: pip install checkov --quiet

      - name: Run Checkov
        run: |
          checkov -d . \
            --output json \
            --quiet \
            --soft-fail \
            > checkov_results.json || true
          cat checkov_results.json

      # ── Claude AI Review ─────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Checkout ai-infra-reviewer scripts
        uses: actions/checkout@v4
        with:
          repository: Sai9700128/AI_infra_reviewer
          path: ai-infra-reviewer

      - name: Run AI review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python reviewer/ai_review.py

      # ── OPA Policy Gate ──────────────────────────────────────────────────
      - name: Run OPA policy gate
        run: python reviewer/policy_gate.py

      # ── Post PR comment ──────────────────────────────────────────────────
      - name: Post PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            // ── parse tflint ──
            let tflintFindings = [];
            try {
              const raw = JSON.parse(fs.readFileSync('tflint_results.json', 'utf8'));
              tflintFindings = (raw.issues || []).map(i => ({
                severity: i.rule?.severity === 'error' ? 'ERROR' : 'WARNING',
                file: i.range?.filename || 'unknown',
                line: i.range?.start?.line || '-',
                message: i.message
              }));
            } catch (e) {
              console.log('tflint parse error:', e.message);
            }

            // ── parse checkov ──
            let checkovFindings = [];
            try {
              const raw = JSON.parse(fs.readFileSync('checkov_results.json', 'utf8'));
              const results = raw.results || raw;
              const failed = Array.isArray(results)
                ? results.flatMap(r => r.results?.failed_checks || [])
                : (results.failed_checks || []);
              checkovFindings = failed.map(c => {
                // checkov severity lives at check_result.evaluated_keys or severity field
                const sev = (c.severity || '').toUpperCase();
                const mapped = sev === 'HIGH' ? 'HIGH'
                  : sev === 'MEDIUM' ? 'MEDIUM'
                  : sev === 'LOW' ? 'LOW'
                  : sev === 'CRITICAL' ? 'CRITICAL'
                  : 'LOW';
                return {
                  severity: mapped,
                  file: (c.repo_file_path || c.file_path || 'unknown').replace(/^\//, ''),
                  line: (c.file_line_range || ['-'])[0],
                  message: c.check_name,
                  check_id: c.check_id || ''
                };
              });
            } catch (e) {
              console.log('checkov parse error:', e.message);
            }

            // ── parse AI findings ──
            let aiFindings = [];
            let aiSummary = '';
            try {
              const raw = JSON.parse(fs.readFileSync('ai_results.json', 'utf8'));
              aiFindings = raw.findings || [];
              aiSummary = raw.summary || '';
            } catch (e) {
              console.log('AI results parse error:', e.message);
            }

            // ── parse policy result ──
            let policyResult = null;
            try {
              policyResult = JSON.parse(fs.readFileSync('policy_result.json', 'utf8'));
            } catch (e) {
              console.log('Policy result parse error:', e.message);
            }

            // ── severity helpers ──
            const icon = s => ({ CRITICAL: '🔴', HIGH: '🟠', MEDIUM: '🟡', LOW: '🔵', ERROR: '🔴', WARNING: '🟡', INFO: '⚪' }[s] || '⚪');
            const label = s => `${icon(s)} ${s}`;

            // ── summary counts ──
            const aiCritical  = aiFindings.filter(f => f.severity === 'CRITICAL').length;
            const aiHigh      = aiFindings.filter(f => f.severity === 'HIGH').length;
            const aiMedium    = aiFindings.filter(f => f.severity === 'MEDIUM').length;
            const aiInfo      = aiFindings.filter(f => f.severity === 'INFO').length;
            const ckCritical  = checkovFindings.filter(f => f.severity === 'CRITICAL').length;
            const ckHigh      = checkovFindings.filter(f => f.severity === 'HIGH').length;
            const ckMedium    = checkovFindings.filter(f => f.severity === 'MEDIUM').length;
            const tflintErrors = tflintFindings.filter(f => f.severity === 'ERROR').length;

            // ── build comment ──
            let body = `## 🔍 AI Infrastructure Review\n\n`;

            // ── policy gate banner ──
            if (policyResult) {
              if (!policyResult.allow) {
                body += `> ❌ **Merge blocked** — ${policyResult.critical_count} CRITICAL finding(s) must be resolved before merge\n\n`;
              } else {
                body += `> ✅ **Merge allowed** — no critical findings\n\n`;
              }
            }

            // ── summary counts table ──
            body += `### 📊 Summary\n`;
            body += `| Tool | 🔴 Critical | 🟠 High | 🟡 Medium | 🔵 Low/Info |\n`;
            body += `|---|---|---|---|---|\n`;
            body += `| 🤖 Claude AI | ${aiCritical} | ${aiHigh} | ${aiMedium} | ${aiInfo} |\n`;
            body += `| 🛡️ Checkov | ${ckCritical} | ${ckHigh} | ${ckMedium} | ${checkovFindings.length - ckCritical - ckHigh - ckMedium} |\n`;
            body += `| 🔧 tflint | ${tflintErrors} | - | - | ${tflintFindings.length - tflintErrors} |\n\n`;

            // ── Claude AI section ──
            body += `### 🤖 Claude AI Analysis\n`;
            if (aiSummary) body += `> ${aiSummary}\n\n`;
            if (aiFindings.length === 0) {
              body += `✅ No issues found\n`;
            } else {
              body += `| Severity | Category | Resource | Line | Issue |\n`;
              body += `|---|---|---|---|---|\n`;
              aiFindings.forEach(f => {
                body += `| ${label(f.severity)} | ${f.category} | \`${f.resource || '-'}\` | ${f.line || '-'} | ${f.description}<br>💡 _${f.suggestion}_ |\n`;
              });
            }

            // ── tflint section ──
            body += `\n### 🔧 tflint — Syntax & Validity\n`;
            if (tflintFindings.length === 0) {
              body += `✅ No issues found\n`;
            } else {
              body += `| Severity | File | Line | Issue |\n|---|---|---|---|\n`;
              tflintFindings.forEach(f => {
                body += `| ${label(f.severity)} | \`${f.file}\` | ${f.line} | ${f.message} |\n`;
              });
            }

            // ── Checkov section ──
            body += `\n### 🛡️ Checkov — Security & Compliance\n`;
            if (checkovFindings.length === 0) {
              body += `✅ No issues found\n`;
            } else {
              // show HIGH and CRITICAL first, then the rest
              const priority = checkovFindings.filter(f => ['CRITICAL','HIGH'].includes(f.severity));
              const rest     = checkovFindings.filter(f => !['CRITICAL','HIGH'].includes(f.severity));
              const toShow   = [...priority, ...rest].slice(0, 15);

              body += `| Severity | File | Line | Check |\n|---|---|---|---|\n`;
              toShow.forEach(f => {
                body += `| ${label(f.severity)} | \`${f.file}\` | ${f.line} | ${f.message} |\n`;
              });
              if (checkovFindings.length > 15) {
                body += `\n_...and ${checkovFindings.length - 15} more findings. Run Checkov locally for the full report._\n`;
              }
            }

            body += `\n---\n_🤖 Claude AI · 🔧 tflint · 🛡️ Checkov · ⚖️ OPA — [ai-infra-reviewer](https://github.com/${context.repo.owner}/${context.repo.repo})_`;

            // ── update existing comment or create new one ──
            const marker = '## 🔍 AI Infrastructure Review';
            const comments = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo
            });

            const existing = comments.data.find(c =>
              c.user.login === 'github-actions[bot]' && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body
              });
              console.log('Updated existing comment');
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body
              });
              console.log('Created new comment');
            }
